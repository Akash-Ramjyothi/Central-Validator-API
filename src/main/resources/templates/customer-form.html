<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Registration Form</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-container {
            max-width: 500px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
        }

        .required {
            color: red;
        }

        .submit-btn {
            margin-top: 20px;
            padding: 10px 15px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="form-container">
    <p><i>Fill out the form. Fields marked with <span class="required">*</span> are required.</i></p>

    <form th:action="@{/processForm}" th:object="${customer}" method="POST" novalidate>

        <label for="firstName">First Name</label>
        <input type="text" id="firstName" th:field="*{firstName}" />

        <label for="lastName">Last Name <span class="required">*</span></label>
        <input type="text" id="lastName" th:field="*{lastName}" />
        <span th:if="${#fields.hasErrors('lastName')}"
              th:errors="*{lastName}"
              class="error"></span>

        <label for="freePasses">Free Passes</label>
        <input type="text" id="freePasses" th:field="*{freePasses}" />
        <span th:if="${#fields.hasErrors('freePasses')}"
              th:errors="*{freePasses}"
              class="error"></span>

        <label for="postalCode">Postal Code</label>
        <input type="text" id="postalCode" th:field="*{postalCode}" />
        <span th:if="${#fields.hasErrors('postalCode')}"
              th:errors="*{postalCode}"
              class="error"></span>

        <label for="courseCode">Course Code</label>
        <input type="text" id="courseCode" th:field="*{courseCode}" />
        <span th:if="${#fields.hasErrors('courseCode')}"
              th:errors="*{courseCode}"
              class="error"></span>

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</div>

</body>
</html>
